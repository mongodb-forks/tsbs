name: vendor-archive

on:
  push:
    paths: ["go.mod", "go.sum", ".github/workflows/vendor-archive.yml", "vendor-archive/**"]
  pull_request:
    paths: ["go.mod", "go.sum", ".github/workflows/vendor-archive.yml", "vendor-archive/**"]

jobs:
  check-archive:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Regenerate the vendor tree and compare with the archive
        run: |
          expected="vendor-archive/tsbs-vendor-$(sha256sum go.mod | cut -c1-12).tar.gz"
          if [ ! -f "$expected" ]; then
            echo "::error::No vendor archive for the current go.mod. Run 'go mod vendor' and commit:"
            echo "::error::  COPYFILE_DISABLE=1 tar czf $expected vendor"
            exit 1
          fi
          mkdir archive-copy
          mv "$expected" archive-copy/
          tar -C archive-copy -xzf "archive-copy/$(basename "$expected")"
          go mod vendor
          diff -r vendor archive-copy/vendor || {
            echo "::error::$expected does not match a fresh 'go mod vendor' run for the current go.mod. Regenerate and commit it."
            exit 1
          }
